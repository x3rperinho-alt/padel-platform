<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Padel Club</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1A16">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F6F4; --surface: #FFFFFF; --surface-2: #EEF2F0;
    --ink: #10221C; --ink-2: #55665F; --ink-3: #8B9A93; --line: #D8E0DC;
    --court: #1F4FA3; --court-ink: #FFFFFF;
    --ball: #D9E84A; --ball-ink: #1B2600;
    --win: #E3F2E7; --danger: #B23A3A; --danger-bg:#FBEAEA;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1A16; --surface: #182722; --surface-2: #1E2F29;
      --ink: #EEF3F0; --ink-2: #9DB0A7; --ink-3: #64766E; --line: #2A3B35;
      --court: #3D74D1; --court-ink: #FFFFFF;
      --ball: #D9E84A; --ball-ink: #1B2600;
      --win: #1E3A2A; --danger: #E06A6A; --danger-bg:#3A1E1E;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1A16; --surface: #182722; --surface-2: #1E2F29;
    --ink: #EEF3F0; --ink-2: #9DB0A7; --ink-3: #64766E; --line: #2A3B35;
    --court: #3D74D1; --court-ink: #FFFFFF;
    --ball: #D9E84A; --ball-ink: #1B2600;
    --win: #1E3A2A; --danger: #E06A6A; --danger-bg:#3A1E1E;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%;
    padding-bottom: 70px;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 14px 14px 30px; }
  h1,h2,h3 { font-family: "Barlow Semi Condensed", sans-serif; margin: 0; }
  h1 { font-weight: 800; font-size: 28px; }
  h2 { font-weight: 700; font-size: 21px; }
  h3 { font-weight: 600; font-size: 17px; }
  a { color: inherit; }

  header.top { padding: 6px 0 12px; display:flex; align-items:center; justify-content:space-between; }
  header.top .brand { display:flex; align-items:center; gap:8px; }
  header.top .ball-dot { width:14px; height:14px; border-radius:50%; background:var(--ball); flex:0 0 auto; }

  nav.tabs {
    position: fixed; left:0; right:0; bottom:0; z-index:20;
    background: var(--surface); border-top:1px solid var(--line);
    display:flex; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    gap:4px;
  }
  nav.tabs button {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    background:none; border:none; color:var(--ink-3); font-family:inherit;
    font-size:11.5px; font-weight:600; padding:6px 2px; border-radius:10px; cursor:pointer;
  }
  nav.tabs button .ic { font-size:18px; line-height:1; }
  nav.tabs button.active { color: var(--court); }
  nav.tabs button.active .ic { transform: scale(1.05); }

  .card {
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px;
  }
  .card + .card { margin-top: 0; }
  .muted { color: var(--ink-2); }
  .tiny { font-size: 12.5px; color: var(--ink-3); }

  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .stack { display:flex; flex-direction:column; gap:10px; }
  .wrap-tags { display:flex; flex-wrap:wrap; gap:8px; }

  label.field { display:block; margin-bottom:12px; }
  label.field .lbl { display:block; font-size:13px; font-weight:600; color:var(--ink-2); margin-bottom:6px; }
  input[type=text], input[type=number], input[type=date], input[type=time], select, textarea {
    width:100%; font-family:inherit; font-size:15.5px; color:var(--ink);
    background: var(--surface-2); border:1.5px solid var(--line); border-radius:10px;
    padding:10px 12px; appearance:none;
  }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--court); }
  .seg { display:flex; border:1.5px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button { flex:1; background:var(--surface-2); border:none; padding:10px 8px; font-family:inherit; font-size:14px; font-weight:600; color:var(--ink-2); cursor:pointer; border-right:1px solid var(--line); }
  .seg button:last-child { border-right:none; }
  .seg button.active { background:var(--court); color:var(--court-ink); }

  .chip { display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface-2); font-size:14px; font-weight:600; cursor:pointer; color:var(--ink-2); }
  .chip.active { background:var(--court); color:var(--court-ink); border-color:var(--court); }
  .chip.inactive { opacity:.45; }

  button.btn { font-family:inherit; font-weight:700; font-size:15px; border-radius:10px; padding:12px 16px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; }
  button.btn.primary { background:var(--ball); color:var(--ball-ink); border-color:transparent; }
  button.btn.ghost { background:transparent; border-color:transparent; color:var(--court); padding:8px 4px; }
  button.btn.danger { color:var(--danger); }
  button.btn:disabled { opacity:.4; cursor:not-allowed; }
  button.btn.block { width:100%; }
  button.btn.sm { padding:8px 12px; font-size:13.5px; }

  table.tbl { width:100%; border-collapse:collapse; font-size:14px; }
  table.tbl th { text-align:left; font-size:12px; color:var(--ink-3); font-weight:600; padding:6px 8px; border-bottom:1.5px solid var(--line); }
  table.tbl td { padding:8px; border-bottom:1px solid var(--line); }
  table.tbl tr:last-child td { border-bottom:none; }
  table.tbl td, table.tbl th { white-space:nowrap; }
  table.tbl td.pts { color:var(--ink-2); font-variant-numeric: tabular-nums; }
  table.tbl th.sortable { cursor:pointer; user-select:none; -webkit-user-select:none; }
  table.tbl th.sortable .arr { margin-left:4px; opacity:.45; font-size:10px; }
  table.tbl th.sortable.on { color:var(--court); }
  table.tbl th.sortable.on .arr { opacity:1; }
  table.tbl td.pts span:first-child { color:var(--ink); font-weight:600; }
  .card:has(table.tbl) { overflow-x:auto; }

  .pos-badge { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; background:var(--surface-2); font-weight:700; font-size:13px; color:var(--ink-2); }
  .pos-badge.gold { background:var(--ball); color:var(--ball-ink); }

  .empty { text-align:center; padding:34px 16px; color:var(--ink-3); }
  .empty .ic { font-size:34px; margin-bottom:8px; }

  .toast { position:fixed; left:50%; bottom:78px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:40; }
  .toast.show { opacity:1; }

  .match { background:var(--surface-2); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .match .court-lbl { font-size:11.5px; color:var(--ink-3); margin-bottom:6px; }
  .match .mrow { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; }
  .match .pair { font-weight:600; font-size:14px; line-height:1.25; }
  .match .pair.right { text-align:right; }
  .match .pair small { display:block; font-weight:400; color:var(--ink-2); font-size:13px; }
  .match .pair.winner { color:var(--court); }
  .match .score { display:flex; align-items:center; gap:5px; }
  .match .score input { width:52px; height:46px; text-align:center; font-weight:700; font-size:19px; padding:0; }
  .match .score .colon { font-weight:700; color:var(--ink-3); }
  .match .score input:disabled { opacity:1; color:var(--ink); background:transparent; border-color:transparent; -webkit-text-fill-color:var(--ink); }

  .hm-table { border-collapse:collapse; font-size:11.5px; }
  .hm-table th { padding:3px; font-weight:600; color:var(--ink-2); writing-mode:vertical-rl; text-orientation:mixed; max-width:26px; }
  .hm-table td { width:30px; height:30px; text-align:center; font-weight:700; border:1px solid var(--bg); }
  .hm-table td.self { background:var(--surface-2); color:var(--ink-3); }
  .hm-table th.rowlbl { writing-mode:horizontal-tb; text-align:right; padding-right:6px; }

  svg.formchart { width:100%; height:180px; display:block; }
  .h2h-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:8px; }
  .h2h-stat { background:var(--surface-2); border-radius:10px; padding:8px 6px; text-align:center; display:flex; flex-direction:column; gap:2px; }
  .h2h-stat strong { font-size:16px; }
  .h2h-game { background:var(--surface-2); border-radius:10px; padding:8px 10px; margin-bottom:6px; }
  .h2h-game .mrow { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; margin-top:4px; }
  .h2h-game .pair { font-weight:600; font-size:13.5px; line-height:1.25; }
  .h2h-game .pair.right { text-align:right; }
  .h2h-game .pair small { display:block; font-weight:400; color:var(--ink-2); font-size:12.5px; }
  .h2h-game .pair.winner { color:var(--court); }
  .h2h-game .sc { font-weight:700; font-size:17px; white-space:nowrap; }

  .badge-list { display:flex; flex-direction:column; gap:10px; margin-top:8px; }
  .badge { display:flex; gap:10px; align-items:flex-start; padding:10px; background:var(--surface-2); border-radius:12px; }
  .badge-ic { font-size:24px; line-height:1; width:32px; text-align:center; flex:0 0 auto; }
  .badge-body { flex:1; min-width:0; }
  .badge-name { font-weight:700; font-size:15px; }
  .badge-holder { display:flex; flex-direction:column; margin-top:6px; padding-top:6px; border-top:1px dashed var(--line); }
  .badge-holder strong { font-size:14.5px; color:var(--court); }
  .badge-person { padding:8px 0; border-bottom:1px solid var(--line); }
  .badge-person:last-child { border-bottom:none; }
  .chip.badge-chip { cursor:default; flex-direction:column; align-items:flex-start; gap:1px; padding:6px 10px; }
  .chip.badge-chip small { font-weight:400; font-size:11px; color:var(--ink-3); white-space:normal; }
  .card.quote { background:linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%); border-color:var(--ball); }
  .quote-text { font-family:"Barlow Semi Condensed", sans-serif; font-weight:600; font-size:16.5px; line-height:1.3; }
  .fmt-info { display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; border-radius:50%; border:1.5px solid currentColor; background:none; color:inherit; opacity:.55; font:italic 700 11px/1 Georgia, serif; padding:0; margin-left:2px; cursor:pointer; vertical-align:middle; }
  .fmt-info:hover, .fmt-info.on { opacity:1; }
  .chip.active .fmt-info { border-color:var(--court-ink); color:var(--court-ink); }
  .edit-pen { background:none; border:none; color:var(--ink-3); cursor:pointer; font-size:12px; padding:0 4px; opacity:.6; }
  .edit-pen:hover { opacity:1; color:var(--court); }
  .log-row { padding:7px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .log-row:last-child { border-bottom:none; }
  .section-head { display:flex; align-items:center; justify-content:space-between; margin: 18px 0 10px; }
  .section-head h2 { font-size:19px; }

  select[multiple] { height:auto; }
  .link-row { display:flex; align-items:center; justify-content:space-between; padding:10px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .link-row:last-child { border-bottom:none; }
  .link-row .arrow { color:var(--ink-3); }

  ::placeholder { color: var(--ink-3); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="ball-dot"></span><h1>Padel Club</h1></div>
    <span style="display:flex;align-items:center;gap:8px;"><span class="tiny" id="whoami"></span><span class="tiny" id="syncStatus">просмотр</span><button class="btn sm primary" id="saveNow" style="display:none;">Сохранить</button><button class="btn sm ghost" id="themeBtn" title="тема" style="padding:6px 8px;font-size:16px;">◐</button><button class="btn sm ghost" id="logoutBtn" title="выйти" style="padding:6px 8px;font-size:15px;">⎋</button></span>
  </header>
  <div id="view"></div>
</div>

<nav class="tabs">
  <button data-tab="tournaments"><span class="ic">&#127934;</span>Турниры</button>
  <button data-tab="bookings"><span class="ic">&#128197;</span>Брони</button>
  <button data-tab="stats"><span class="ic">&#128202;</span>Статистика</button>
  <button data-tab="players"><span class="ic">&#128101;</span>Игроки</button>
</nav>
<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
