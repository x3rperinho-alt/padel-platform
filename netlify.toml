# Каждый сайт пересобирается только когда меняется ЕГО папка — экономит кредиты Netlify.
# padelfreakclub — приложение друзей (папка friends/), остальное (048padel) — коммьюнити (папка community/).
[build]
  ignore = "if [ \"$SITE_NAME\" = \"padelfreakclub\" ]; then D=friends; else D=community; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- $D/"
