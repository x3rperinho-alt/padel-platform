# Раз в сутки: 1) "пинг" базы, чтобы бесплатный проект Supabase не засыпал; 2) резервная копия данных в репозиторий (папка backups/).
name: keepalive-and-backup
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --omit=dev
      - run: node scripts/backup.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: |
          git config user.name "backup-bot" && git config user.email "backup@users.noreply.github.com"
          git add backups && git commit -m "backup $(date -u +%F)" || echo "nothing to commit"
          git push
